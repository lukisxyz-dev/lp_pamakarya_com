#:schema node_modules/wrangler/config-schema.json
# Wrangler config for the Keystatic admin's on-demand routes and the static
# site around them. The Astro build writes dist/server/wrangler.json with the
# bindings it needs (ASSETS, SESSION, IMAGES); this file is what `wrangler
# deploy` reads, and the Astro adapter merges its own settings in at build.
#
# Secrets are NOT here -- set them per environment instead:
#   wrangler secret put KEYSTATIC_GITHUB_CLIENT_ID
#   wrangler secret put KEYSTATIC_GITHUB_CLIENT_SECRET
#   wrangler secret put KEYSTATIC_SECRET
# and, for the admin's "login with GitHub" button, a plain var:
#   PUBLIC_KEYSTATIC_GITHUB_APP_SLUG
name = "pamakarya"
compatibility_date = "2026-09-16"
main = "dist/server/entry.mjs"

[assets]
directory = "dist/client"
binding = "ASSETS"

[[kv_namespaces]]
binding = "SESSION"

[images]
binding = "IMAGES"
