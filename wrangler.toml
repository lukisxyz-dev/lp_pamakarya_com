#:schema node_modules/wrangler/config-schema.json
# Wrangler config for local dev bindings. The deploy config is the one the
# Astro build writes to dist/server/wrangler.json (it carries the real `main`
# and the assets directory), so deploy with:
#   npx wrangler deploy -c dist/server/wrangler.json
# Keeping `main` out of this file is deliberate: astro dev reads it through
# the Cloudflare vite plugin, which fails when main points at a build output
# that does not exist yet.
#
# Secrets are NOT here -- set them per environment instead:
#   wrangler secret put KEYSTATIC_GITHUB_CLIENT_ID
#   wrangler secret put KEYSTATIC_GITHUB_CLIENT_SECRET
#   wrangler secret put KEYSTATIC_SECRET
# and, for the admin's "login with GitHub" button, a plain var:
#   PUBLIC_KEYSTATIC_GITHUB_APP_SLUG
name = "pamakarya"
compatibility_date = "2026-09-16"

[[kv_namespaces]]
binding = "SESSION"

[images]
binding = "IMAGES"

