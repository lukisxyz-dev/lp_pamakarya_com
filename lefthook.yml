# Format staged files on commit and re-stage the result, so the formatted
# output lands in the same commit even when it was not staged beforehand.
#
# Two formatters by necessity: oxfmt silently skips .astro (it has no parser
# for the extension), so .astro goes through Prettier + prettier-plugin-astro.
# Both configs use the same indent/width so the two never fight over shared
# files.
#
# Skip with: LEFTHOOK=0 git commit ...

pre-commit:
  parallel: true
  jobs:
    - name: oxfmt
      glob: "*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,json,jsonc,css,scss,less,html,md,mdx,yaml,yml,toml}"
      run: node_modules/.bin/oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: prettier (astro)
      glob: "*.astro"
      run: node_modules/.bin/prettier --write {staged_files}
      stage_fixed: true
